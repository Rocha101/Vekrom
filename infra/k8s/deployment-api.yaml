apiVersion: apps/v1
kind: Deployment
metadata:
  name: vekrom-api
  labels:
    app: vekrom-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vekrom-api
  template:
    metadata:
      labels:
        app: vekrom-api
    spec:
      containers:
        - name: api
          image: vekrom/api:latest
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vekrom-secrets
                  key: database-url
            - name: REDIS_URL
              value: redis://redis:6379
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vekrom-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vekrom-api
spec:
  selector:
    app: vekrom-api
  ports:
    - port: 3001
      targetPort: 3001
