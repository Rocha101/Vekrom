apiVersion: apps/v1
kind: Deployment
metadata:
  name: vekrom-gateway
  labels:
    app: vekrom-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vekrom-gateway
  template:
    metadata:
      labels:
        app: vekrom-gateway
    spec:
      containers:
        - name: gateway
          image: vekrom/gateway:latest
          ports:
            - containerPort: 3002
          env:
            - name: REDIS_URL
              value: redis://redis:6379
            - name: API_URL
              value: http://vekrom-api:3001
          readinessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vekrom-gateway
spec:
  selector:
    app: vekrom-gateway
  ports:
    - port: 3002
      targetPort: 3002
